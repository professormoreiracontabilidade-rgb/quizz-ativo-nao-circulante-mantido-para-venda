<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07387a"><title>Quiz CPC 31 — Professor Moreira</title><style>
:root{--navy:#07387a;--yellow:#ffdb4c;--bg:#ebf4ff;--ink:#102847}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;font-size:19px}header{background:var(--navy);color:#fff;padding:13px;text-align:center;font-weight:800;font-size:clamp(17px,4.5vw,24px)}header span{color:var(--yellow)}main{max-width:850px;margin:auto;padding:12px 12px 105px}.panel{background:white;border-radius:18px;padding:clamp(17px,4vw,28px);box-shadow:0 3px 17px #16446a20}.center{text-align:center}.cover-title{font-size:clamp(29px,7vw,44px);color:var(--navy);line-height:1.14}h2{font-size:clamp(24px,5vw,32px);margin:12px 0;color:var(--navy)}.lead{font-size:22px;line-height:1.6}.meta{font-size:15px;letter-spacing:.2px;color:#4e6381;background:#eff5fc;padding:9px 12px;border-radius:10px;font-weight:650}.statement{font-size:clamp(19px,4.5vw,25px);white-space:normal;line-height:1.6;margin:22px 0}.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #c5d7ed;border-radius:14px;background:#fff;padding:13px;margin:11px 0;font-size:clamp(17px,4vw,21px);line-height:1.42;color:var(--ink);cursor:pointer}.option .letter{background:#e5eefb;border-radius:9px;min-width:32px;text-align:center;font-weight:bold;padding:3px}.option.selected{border-color:#0854ba;background:#e7f0ff}.option.good{border-color:#19844b;background:#e7faee}.option.bad{border-color:#d52b33;background:#ffebeb}.option:disabled{cursor:default}.feedback{border-left:7px solid #1d8250;background:#e9f9ec;border-radius:12px;padding:16px;margin-top:20px;line-height:1.55}.feedback.error{border-color:#c62828;background:#ffeded}.feedback.warn{border-color:#bc8200;background:#fff8df}.feedback h3{margin:0 0 8px;font-size:23px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}button.action{border:0;background:#0a4ca0;color:white;font-size:19px;font-weight:750;border-radius:12px;padding:14px 19px;cursor:pointer;min-height:52px}button.action:disabled{opacity:.4;cursor:default}.action.green{background:#178345}.action.yellow{background:#e6b400;color:#152544}.action.gray{background:#596c84}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #bfcfe0;padding:9px 12px;display:flex;justify-content:center;gap:12px;z-index:5}.bottom button{flex:1;max-width:230px}input{font-size:22px;padding:14px;border:2px solid #aebfda;border-radius:12px;width:100%;max-width:500px}.bar{height:9px;background:#dae7f5;border-radius:50px;margin:12px 0 20px;overflow:hidden}.fill{height:100%;background:#14804d;transition:width .2s}.small{font-size:16px;color:#536681}.score{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.score>div{background:#eaf2ff;padding:20px;text-align:center;border-radius:15px}.score b{display:block;font-size:32px;color:#07387a}.pulse-good{animation:flashG .65s}.pulse-bad{animation:flashR .65s}@keyframes flashG{50%{box-shadow:inset 0 0 0 100vmax #00c34d28}}@keyframes flashR{50%{box-shadow:inset 0 0 0 100vmax #e9000025}}@media(max-width:430px){.bottom button{padding:11px 9px;font-size:16px}.panel{padding:16px}.meta{font-size:13px}}
</style></head><body><header>CURSO DE CONTABILIDADE <span>PROFESSOR MOREIRA</span></header><main id="app"></main><nav id="nav" class="bottom" hidden><button class="action gray" id="prev" onclick="move(-1)">⬅ Voltar</button><button class="action" id="next" onclick="move(1)">Avançar ➜</button><button class="action yellow" onclick="resetQuiz()">↻ Reiniciar</button></nav><script>
const questions=[{"origin": "FGV - Cons TE (SEFAZ ES)/SEFAZ ES/Ciências Contábeis/2022", "text": "Em 31/12/X0, uma sociedade empresária que presta serviços a terceiros, colocou à venda um de seus prédios por um preço considerado razoável pelo mercado. A sociedade empresária estava comprometida em vender o prédio e considerava provável a realização da venda. Ainda, ela continuava utilizando o prédio em suas atividades até encontrar um comprador, quando será feita a transferência para a nova localização. Assinale a opção que indica a classificação do prédio no balanço patrimonial da sociedade empresária, em 31/12/X0.", "options": ["Ativo não circulante mantido para venda.", "Ativo imobilizado.", "Propriedade para Investimento.", "Ativo realizável a longo prazo.", "Não deve haver reconhecimento."], "answer": "A", "explanation": "ATENÇÃO: há uma possível inconsistência no gabarito do PDF. O PDF indica A, mas o enunciado afirma que o prédio continua em uso até encontrar comprador. Pelo CPC 31, é necessário estar disponível para venda imediata nas condições atuais; essa informação sugere a alternativa B (imobilizado). A alternativa A foi mantida como gabarito do material de origem, com ressalva.", "number": 1}, {"origin": "FGV - AJ TRT16/TRT 16/Administrativa/Contabilidade/2022", "text": "Uma entidade decide colocar à venda um terreno que antes era mantido para valorização. O terreno passa a ser contabilizado como ativo não circulante mantido para venda. A entidade obtém um compromisso firme de compra e, como resultado, o comprador impõe inesperadamente condições à transferência do terreno que irão estender o período exigido para que a venda seja concluída por mais doze meses. As ações necessárias para responder às condições foram tomadas e a administração espera uma solução favorável dos fatores que causaram o atraso. No balanço patrimonial, o terreno deve ser contabilizado como", "options": ["Ativo Imobilizado.", "Patrimônio Líquido.", "Ativo Realizável a Longo Prazo.", "Propriedade para Investimento.", "Ativo não Circulante mantido para venda."], "answer": "E", "explanation": "O prazo de um ano admite exceção quando o atraso decorre de circunstâncias fora do controle da entidade e há evidências de compromisso contínuo com a venda. As condições impostas inesperadamente pelo comprador, com providências adotadas e solução favorável esperada, permitem manter a classificação.", "number": 2}, {"origin": "FGV - AJ (TJ RO)/TJ RO/Contador/2021", "text": "Uma entidade deve classificar um ativo não circulante como mantido para venda quando esperar que o seu valor contábil seja recuperado, principalmente, por meio de transação de venda em vez do uso contínuo. De acordo com o Pronunciamento Técnico CPC 31, no balanço patrimonial, tais ativos devem ser apresentados:", "options": ["como componente do grupo Investimentos;", "líquidos de receitas ou despesas associadas;", "líquidos dos passivos associados;", "no subgrupo Estoques;", "separadamente dos outros ativos."], "answer": "E", "explanation": "O CPC 31 exige apresentação separada dos ativos classificados como mantidos para venda no balanço patrimonial. Não devem ser misturados a estoques, investimentos ou apresentados líquidos dos passivos associados.", "number": 3}, {"origin": "FGV - Ana (PGM Niterói)/Pref Niterói/Contábil/2023", "text": "Um segmento operacional (negócio) de uma empresa foi colocado à venda. O processo começou há um ano e meio, quando os ativos foram classificados como ativo não circulante mantido para venda, contudo, o processo ainda não acabou, pois a causa principal envolveu um fato fora do controle da entidade. Porém, a empresa continua comprometida com o seu plano de venda do negócio. Nesse caso, o CPC 31 estabelece que:", "options": ["devem-se remover os ativos da classificação de não circulante mantido para venda, pois o processo ultrapassou um ano a partir da data da classificação;", "devem-se mensurar as despesas de venda pelo valor presente, e qualquer aumento no valor presente das despesas de venda que resulte da passagem do tempo deve ser apresentado nos resultados como despesa operacional;", "deve-se mensurar o ativo não circulante mantido para distribuição aos sócios pelo maior valor entre seu valor contábil e seu valor justo diminuído das despesas de distribuição;", "pode-se estender o período de conclusão da venda para além de um ano e manter a classificação como ativo não circulante mantido para venda;", "deve-se depreciar o ativo não circulante classificado como mantido para venda."], "answer": "D", "explanation": "A venda pode ultrapassar um ano quando o atraso foge ao controle da entidade e há evidências suficientes de que a administração permanece comprometida com o plano. O prazo não cancela automaticamente a classificação.", "number": 4}, {"origin": "FGV - AL (SEN)/SEN/Contabilidade/2022", "text": "A Companhia A tem participação de 12% na Companhia B, com influência significativa. A participação societária está contabilizada no Balanço Patrimonial por R$30.000. Em 01/12/X0, a administração da Cia. A decidiu vender a participação na Cia. B. O nível hierárquico de gestão está comprometido com o plano de venda e com a localização de um comprador. Ainda, é esperado que a venda seja concluída em seis meses, pelo valor de R$32.000. Assinale a opção que indica a contabilização da participação na Cia. B no Balanço Patrimonial da Cia. A em 31/12/X0 e o montante contabilizado.", "options": ["Investimentos / R$30.000.", "Ativo não Circulante mantido para venda / R$30.000.", "Investimentos / R$32.000.", "Ativo Realizável a Longo Prazo / R$32.000.", "Ativo não Circulante mantido para venda / R$32.000."], "answer": "B", "explanation": "Valor contábil: R$ 30.000. Preço de venda esperado: R$ 32.000 (sem despesas de venda informadas). A mensuração é pelo MENOR entre valor contábil e valor justo líquido das despesas de venda. Logo R$ 30.000, no grupo mantido para venda.", "number": 5}, {"origin": "FGV - AJ (TJ RN)/TJ RN/Administrativa/Contabilidade/2023", "text": "Uma entidade está planejando alienar um grupo de ativos. A entidade designa esses ativos como um grupo para alienação. O valor contábil desses ativos imediatamente antes da classificação como mantidos para venda era de R$ 30 milhões. Ao serem classificados como mantidos para venda, os ativos foram reavaliados para R$ 22 milhões. A entidade acredita que custaria R$ 2 milhões para vender o grupo de ativos. Nesse caso, o valor contábil do grupo para alienação nas contas da entidade após sua classificação como mantida para venda é de:", "options": ["R$ 52 milhões;", "R$ 32 milhões;", "R$ 30 milhões;", "R$ 24 milhões;", "R$ 20 milhões."], "answer": "E", "explanation": "Valor contábil anterior: R$ 30 milhões. Valor justo informado: R$ 22 milhões. Despesas para vender: R$ 2 milhões. Valor justo líquido = 22 - 2 = R$ 20 milhões. Menor entre 30 e 20 = R$ 20 milhões.", "number": 6}, {"origin": "FGV - AFRFB/SRFB/Geral/2023", "text": "Uma entidade que trabalha com auditoria contábil adquiriu, em 01/01/X1, por R$700.000 à vista, um imóvel para ser utilizado como sede. A vida útil do imóvel era estimada em 25 anos e não era considerado valor residual. Além disso, a entidade depreciava os seus ativos imobilizados de acordo com o método da linha reta. Em 31/12/X3, o imóvel foi colocado para à venda. Na data, o ativo estava disponível para venda imediata e o nível hierárquico de gestão estava comprometido com o plano de venda do ativo, tendo iniciado um programa para localizar um comprador. Além disso, o valor justo do imóvel, líquido das despesas de venda, foi avaliado em R$720.000. Em 31/12/X4, o imóvel foi vendido por R$750.000 à vista. Assinale a opção que indica o resultado obtido com venda do imóvel, contabilizado na Demonstração do Resultado do Exercício da entidade em 31/12/X4.", "options": ["R$30.000.", "R$50.000.", "R$62.727.", "R$134.000.", "R$162.000."], "answer": "D", "explanation": "Depreciação anual = 700.000 ÷ 25 = R$ 28.000. Em três anos, depreciação acumulada = R$ 84.000. Valor contábil em 31/12/X3 = R$ 616.000. Como o valor justo líquido é R$ 720.000, mantém-se R$ 616.000 e cessa a depreciação. Venda por R$ 750.000: ganho = 750.000 - 616.000 = R$ 134.000.", "number": 7}, {"origin": "FGV - AFRE ES/SEFAZ ES/2021", "text": "Em 30/12/X1, a sociedade empresária X definiu que irá descontinuar sua atual fábrica. Na data, esse ativo tinha valor contábil de R$ 100.000. O valor de venda foi estimado em R$ 140.000. Ainda, foi previsto que a construção da nova fábrica iria demorar quatro meses, momento em que a fábrica antiga deixaria de ser usada. Assinale a opção que indica a apresentação e a mensuração da fábrica no balanço patrimonial da sociedade empresária X, em 31/12/X1.", "options": ["Ativo não Circulante mantido para a venda: R$ 100.000.", "Ativo Imobilizado: R$ 100.000.", "Ativo não Circulante mantido para a venda: R$ 140.000.", "Ativo Imobilizado: R$ 140.000.", "Propriedade para Investimento: R$ 140.000."], "answer": "B", "explanation": "A fábrica antiga ainda será usada durante quatro meses enquanto a nova é construída. Não está disponível para venda imediata nas condições atuais. Permanece no imobilizado por R$ 100.000.", "number": 8}, {"origin": "FGV - AnA (FunSaúde CE)/FunSaúde CE/Contabilidade/2021", "text": "Em 01/07/X0, uma sociedade empresária adquiriu um carro por R$ 50.000 para realizar o transporte de seu diretor. A vida útil estimada do carro era de cinco anos e a empresa não considerava valor residual. O carro era depreciado pelo método de linha reta. Em 01/01/X2, a sociedade empresária resolveu colocar o carro à venda. Na data, o valor justo estimado do carro era de R$ 20.000 e as despesas da venda de R$ 4.000. Em 01/01/X2, o carro deve ser contabilizado no balanço patrimonial como Ativo não Circulante mantido para Venda pelo seguinte valor:", "options": ["R$ 16.000.", "R$ 20.000.", "R$ 30.000.", "R$ 35.000.", "R$ 40.000."], "answer": "A", "explanation": "Depreciação anual = 50.000 ÷ 5 = R$ 10.000. De 01/07/X0 até 01/01/X2 = 18 meses: depreciação = R$ 15.000; valor contábil = R$ 35.000. Valor justo líquido = 20.000 - 4.000 = R$ 16.000. Registra-se R$ 16.000.", "number": 9}, {"origin": "FGV - Sup (IMBEL)/IMBEL/Contador/2021", "text": "Em 01/01/X0, uma entidade adquiriu um computador para utilizar em seus negócios por R$ 8.000. Na data, a entidade esperava utilizar o computador durante quatro anos, e não considerava valor residual. Em 30/06/X1, a entidade decidiu colocar o computador à venda, contabilizando-o em seu balanço patrimonial como Ativo não Circulante mantido para venda. Na data, o valor justo líquido de despesas de venda era de R$ 6.000. Em 31/12/X1, a empresa ainda não conseguiu vender o ativo, e o valor justo líquido de despesas de venda era estimado em R$ 3.000. Assinale a opção que indica o valor do computador contabilizado no Balanço Patrimonial da entidade, em 31/12/X1.", "options": ["R$ 3.000.", "R$ 4.000.", "R$ 5.000.", "R$ 6.000.", "R$ 8.000."], "answer": "A", "explanation": "Depreciação anual = 8.000 ÷ 4 = R$ 2.000. De 01/01/X0 a 30/06/X1 = 18 meses: R$ 3.000; valor contábil = R$ 5.000. Em 30/06, o valor justo líquido (R$ 6.000) não aumenta o saldo. Em 31/12, cai para R$ 3.000, e o ativo é reduzido a R$ 3.000.", "number": 10}, {"origin": "FGV - TT (SEFIN RO)/SEFIN RO/2018", "text": "Em 31/12/2017, a Cia. MAM possuía em seu balanço patrimonial uma sala comercial. O valor contábil da sala comercial era de R$ 60.000 e ela estava contabilizada no Ativo Imobilizado, uma vez que era utilizada nos negócios da empresa. Em 05/01/2018, a direção da empresa decidiu colocar a sala comercial à venda, passando a contabilizá-la no Ativo não Circulante Mantido para a Venda. Na data, seu valor justo era de R$ 50.000. Assinale a opção que indica, respectivamente, o valor pelo qual a sala comercial deve ser contabilizada no Ativo não Circulante Mantido para a Venda e onde deve ser contabilizada a diferença entre o valor contábil e o valor justo.", "options": ["R$ 50.000; despesa.", "R$ 50.000; ajuste de avaliação patrimonial.", "R$ 50.000; redutora do ativo.", "R$ 60.000; receita.", "R$ 60.000; ajuste de avaliação patrimonial."], "answer": "A", "explanation": "Valor contábil = R$ 60.000. Valor justo informado = R$ 50.000. Sem despesas de venda informadas, considera-se R$ 50.000 para fins da questão. A perda de R$ 10.000 afeta o resultado como despesa.", "number": 11}, {"origin": "FGV - Cont (MPE AL)/MPE AL/2018", "text": "Em 31/12/2017, uma entidade apresentava o seguinte balanço patrimonial: Ativo Circulante Caixa 20.000 Ativo Imobilizado Patrimônio Líquido Veículo 30.000 Capital Social 50.000 Ativo Total 50.000 Passivo + PL 50.000 O valor justo do veículo era de R$ 40.000. Em janeiro de 2018, a entidade transferiu o veículo para o grupo Ativo não Circulante mantido para venda. Assinale a opção que indica o impacto da transferência do ativo no balanço patrimonial da entidade.", "options": ["Aumento do ativo não circulante mantido para venda: R$ 30.000; diminuição do ativo imobilizado: R$ 30.000.", "Aumento do ativo não circulante mantido para venda: R$ 40.000; diminuição do ativo imobilizado: R$ 40.000.", "Aumento do ativo não circulante mantido para venda: R$ 40.000; diminuição do ativo imobilizado: R$ 30.000; aumento no passivo: R$ 10.000.", "Aumento do ativo não circulante mantido para venda: R$ 40.000; diminuição do ativo imobilizado: R$ 30.000; aumento no patrimônio líquido: R$ 10.000.", "Aumento do ativo não circulante mantido para venda: R$ 40.000; aumento no patrimônio líquido: R$ 40.000."], "answer": "A", "explanation": "O veículo estava registrado por R$ 30.000 e o valor justo é R$ 40.000. Pelo critério do menor valor, permanece em R$ 30.000. A transferência reduz o imobilizado em R$ 30.000 e aumenta o grupo de ativos mantidos para venda em R$ 30.000, sem ganho.", "number": 12}];const KEY='profmoreira_cpc31_12_fg_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.answers)||state.answers.length!==12)state={name:'',page:-1,answers:Array(12).fill(null)};const letters=['A','B','C','D','E'];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};function counts(){let correct=0,wrong=0;state.answers.forEach((a,i)=>{if(a!==null){if(a===questions[i].answer)correct++;else wrong++}});return{correct,wrong,total:correct+wrong,pct:(correct+wrong)?Math.round(100*correct/(correct+wrong)):0}}function sound(ok){try{let c=new(window.AudioContext||window.webkitAudioContext)();let t=c.currentTime;[[0,ok?650:240],[.13,ok?870:175]].forEach(([dt,f])=>{let o=c.createOscillator(),g=c.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.12,t+dt);g.gain.exponentialRampToValueAtTime(.001,t+dt+.13);o.connect(g);g.connect(c.destination);o.start(t+dt);o.stop(t+dt+.14)});setTimeout(()=>c.close(),600)}catch(e){}}function render(){const a=$('app'),n=$('nav');n.hidden=state.page===-1||state.page===12;if(state.page===-1){a.innerHTML=`<section class="panel center"><div style="font-size:65px">📚</div><h1 class="cover-title">QUIZ FGV<br>ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA</h1><h2>CPC 31</h2><p class="lead">12 questões do PDF com comentários explicativos após cada resposta, sons, luz verde e vermelha e resultado final.</p><label for="name"><b>Nome do aluno</b></label><p><input id="name" placeholder="Digite seu nome" value="${esc(state.name)}"></p><p class="small">O progresso fica salvo neste aparelho. Ao concluir, envie seu resultado ao professor pelo WhatsApp.</p><button class="action green" onclick="start()">▶ Começar o quiz</button>${counts().total?'<button class="action" onclick="continueQuiz()" style="margin:8px">Continuar de onde parei</button>':''}</section>`;return}if(state.page===12){let c=counts();a.innerHTML=`<section class="panel center"><div style="font-size:60px">🏆</div><h1 class="cover-title">RESULTADO FINAL</h1><p><b>${esc(state.name||'Aluno(a)')}</b></p><div class="score"><div><b>${c.correct}</b>Acertos</div><div><b>${c.wrong}</b>Erros</div><div><b>${c.pct}%</b>Aproveitamento</div><div><b>${c.total}/12</b>Respondidas</div></div><button class="action green" onclick="sendWhats()">📲 Enviar resultado ao WhatsApp do professor</button><div class="actions"><button class="action" onclick="state.page=0;save();render()">Revisar questões</button><button class="action gray" onclick="resetQuiz()">↻ Reiniciar</button></div></section>`;return}const i=state.page,q=questions[i],selected=state.answers[i],answered=selected!==null;let optionHtml=q.options.map((v,k)=>{let l=letters[k],cl=answered?(l===q.answer?' good':l===selected?' bad':''):(l===selected?' selected':'');return `<button class="option${cl}" ${answered?'disabled':''} onclick="choose('${l}')"><span class="letter">${l}</span><span>${esc(v)}</span></button>`}).join('');let notice=i===0?'<p class="small">Observação: o gabarito original da questão 1 apresenta uma divergência discutida no comentário.</p>':'';a.innerHTML=`<section class="panel"><div class="meta">QUESTÃO ${i+1} DE 12 — ${esc(q.origin)}</div><div class="bar"><div class="fill" style="width:${100*(i+1)/12}%"></div></div><div class="statement">${esc(q.text)}</div>${optionHtml}${answered?`<aside class="feedback ${selected===q.answer?'':'error'}"><h3>${selected===q.answer?'✅ Resposta de acordo com o gabarito':'❌ Resposta diferente do gabarito do PDF'}</h3><b>Gabarito do PDF: ${q.answer}</b><p>${esc(q.explanation)}</p>${i===0?'<p><b>Alerta didático:</b> o PDF marca A, mas a análise da disponibilidade imediata sugere B. Esta divergência não foi ocultada.</p>':''}</aside>`:'<p class="small">Selecione uma alternativa para conferir o comentário.</p>'}${notice}</section>`;$('prev').disabled=i===0;$('next').innerText=i===11?'Ver resultado ➜':'Avançar ➜';$('next').disabled=!answered}function start(){state.name=$('name').value.trim()||'Aluno(a)';state.page=0;save();render()}function continueQuiz(){state.name=$('name').value.trim()||state.name||'Aluno(a)';let idx=state.answers.findIndex(x=>x===null);state.page=idx<0?12:idx;save();render()}function choose(l){if(state.answers[state.page]!==null)return;let i=state.page;state.answers[i]=l;save();sound(l===questions[i].answer);document.body.classList.add(l===questions[i].answer?'pulse-good':'pulse-bad');setTimeout(()=>document.body.classList.remove('pulse-good','pulse-bad'),680);render()}function move(step){if(step>0&&state.answers[state.page]===null)return;state.page=Math.max(0,Math.min(12,state.page+step));save();render();window.scrollTo(0,0)}function resetQuiz(){if(!confirm('Deseja reiniciar e apagar as respostas salvas?'))return;state={name:state.name,page:-1,answers:Array(12).fill(null)};save();render();window.scrollTo(0,0)}function sendWhats(){const c=counts(),msg=`*CURSO DE CONTABILIDADE PROFESSOR MOREIRA*\n*QUIZ CPC 31 — ATIVO MANTIDO PARA VENDA*\nAluno(a): ${state.name||'Aluno(a)'}\nQuestões: 12\nAcertos: ${c.correct}\nErros: ${c.wrong}\nPercentual: ${c.pct}%\n\nResultado enviado pelo aluno.`;window.open('https://wa.me/5561985323574?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')}render();
</script></body></html>
